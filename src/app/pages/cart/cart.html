<main class="main-content">
    <h2>Список карточек</h2>
    <div class="cards-container">
        @for (product of products_in_cart; track product.id) {

        <app-cart-card [title]="product.title" [desc]="product.desc" [category]="product.category"
            [price]="product.price" [discount]="product.discount" [quantity]="product.quantity"
            (delete)="removeProductFromCart(product.id)"></app-cart-card>

        }@empty {
        <p>Каталог пуст</p>
        }
    </div>
</main>
