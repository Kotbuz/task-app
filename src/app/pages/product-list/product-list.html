<main class="main-content">
    <div class="top">
        <h2>Список карточек</h2>
        <div class="search-container">
            <input type="text" [(ngModel)]="searchQuery" placeholder="Поиск товаров по названию..."
                class="search-input" />
        </div>
    </div>
    <div class="cards-container">
        @for (product of filteredProducts; track product.id) {

        <app-card [title]="product.title" [desc]="product.desc" [category]="product.category" [price]="product.price"
            [discount]="product.discount" [quantity]="product.quantity"
            (cardToCart)="addProductToCart(product.id)"></app-card>

        }@empty {
        <p>Каталог пуст</p>
        }
    </div>
</main>
