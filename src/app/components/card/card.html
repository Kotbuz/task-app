<div class="card catalog" [class.disabled]="quantity === 0">
    <div class="card-image-wrapper">
        <img src="{{ image }}" alt="{{ title }}">
        @if (discount > 0) {
        <div class="badge-discount">
            -{{ discount }}%
        </div>
        }
    </div>

    <div class="card-info">
        <div class="price-block">
            <h2 class="current-price">{{ price }} ₽</h2>
        </div>
        <h3 class="title">{{ title }}</h3>
        <p class="desc">{{ desc }}</p>
        <div class="card-action">
            <button class="cart-btn" (click)="onCartClick()" [disabled]="quantity === 0">
                <span>{{ quantity > 0 ? '🛒 В корзину' : 'Нет в наличии' }}</span>
            </button>
        </div>
    </div>
</div>
